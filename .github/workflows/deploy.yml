name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /coaching-app
      ENABLE_CUSTOM_DOMAIN: 'false'
      CUSTOM_DOMAIN: vak.apps.global-leaders-academy.co.jp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./src/vak_assessment_nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./src/vak_assessment_nextjs

      - name: Build
        run: npm run build
        working-directory: ./src/vak_assessment_nextjs

      - name: Add CNAME
        if: env.ENABLE_CUSTOM_DOMAIN == 'true'
        run: echo "$CUSTOM_DOMAIN" > src/vak_assessment_nextjs/out/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./src/vak_assessment_nextjs/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
